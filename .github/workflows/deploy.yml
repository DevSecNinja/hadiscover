name: Deploy to GitHub Pages (Emergency Only)

# IMPORTANT: This workflow is for EMERGENCY manual deployments only
# Normal deployments happen automatically as part of the release workflow
# which ensures backend changes are coordinated with frontend deployments.
#
# Use this workflow ONLY when:
# - You need to deploy a hotfix outside the normal release cycle
# - The release workflow is broken and you need to deploy immediately
#
# Before running this workflow manually, ensure:
# 1. The latest search data is available in the db-latest release
# 2. Or FRONTEND_SEARCH_INDEX_URL points at an alternate static search index

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      line-coverage: ${{ steps.report.outputs.line-coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: .github/scripts/install-backend-deps.sh

      - name: Run backend tests with coverage
        run: .github/scripts/run-backend-tests.sh

      - name: Publish test results
        id: report
        if: always()
        uses: DevSecNinja/.github/actions/test-report@2eaa83a731b119d02137a7908f5582a8bfd85826 # v5.0.0
        with:
          paths: backend/junit.xml
          title: Backend pytest
          coverage-paths: backend/coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Download latest search index
        run: .github/scripts/download-search-index.sh
        env:
          SEARCH_INDEX_URL: ${{ vars.FRONTEND_SEARCH_INDEX_URL || format('https://github.com/{0}/releases/download/db-latest/search-index.json', github.repository) }}

      - name: Build with Next.js
        working-directory: ./frontend
        run: npm run build

      - name: Write coverage badge
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          LINE_COVERAGE: ${{ needs.test.outputs.line-coverage }}
        run: bash .github/scripts/write-coverage-badge.sh frontend/out/coverage.json "$LINE_COVERAGE"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./frontend/out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
